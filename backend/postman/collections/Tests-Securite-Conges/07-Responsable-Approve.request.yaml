$kind: http-request
name: '07 - Responsable : Approve demande Agent A (200)'
order: 7000
method: POST
url: '{{baseUrl}}/api/leave-requests/{{leaveRequestId_A}}/approve'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{responsable_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responsable peut approuver - status 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Statut de la demande est APPROUVE", function () {
          const json = pm.response.json();
          pm.expect(json.statut).to.be.oneOf(["APPROUVE", "APPROVED", "APPROUVÉ"]);
      });

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestion_conges
      POSTGRES_USER: gestion_conges
      POSTGRES_PASSWORD: gestion_conges_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestion_conges -d gestion_conges"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/gestion_conges
      SPRING_DATASOURCE_USERNAME: gestion_conges
      SPRING_DATASOURCE_PASSWORD: gestion_conges_local
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:

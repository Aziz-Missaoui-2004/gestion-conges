services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestion_conges}
      POSTGRES_USER: ${POSTGRES_USER:-gestion_conges}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestion_conges_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestion_conges} -d ${POSTGRES_DB:-gestion_conges}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-gestion_conges}
      DB_USER: ${POSTGRES_USER:-gestion_conges}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gestion_conges_local}
      JWT_SECRET: ${JWT_SECRET:?Create a .env file from .env.example and set JWT_SECRET}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JPA_SHOW_SQL: "false"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
